<script>
(function () {
  const strip = document.getElementById('partnersStrip');
  const track = document.getElementById('partnersTrack');

  // Start auto scroll
  track.classList.add('scrolling');

  let dragging = false, startX = 0, curX = 0, vel = 0, lastX = 0, lastT = 0, raf = null;

  function getHalf() { return track.scrollWidth / 2; }

  function pauseAndCapture() {
    // Capture current animated position
    track.classList.add('paused');
    const m = new DOMMatrix(window.getComputedStyle(track).transform);
    curX = m.m41;
    track.classList.remove('scrolling');
    track.classList.remove('paused');
    track.style.transform = 'translateX(' + curX + 'px)';
  }

  function move(dx) {
    curX += dx;
    const h = getHalf();
    if (curX <= -h) curX += h;
    if (curX > 0)   curX -= h;
    track.style.transform = 'translateX(' + curX + 'px)';
  }

  function resume() {
    track.style.transform = '';
    track.classList.add('scrolling');
  }

  function fling() {
    cancelAnimationFrame(raf);
    if (Math.abs(vel) < 0.2) { setTimeout(resume, 1400); return; }
    (function step() {
      if (Math.abs(vel) < 0.15) { setTimeout(resume, 1400); return; }
      move(vel);
      vel *= 0.94;
      raf = requestAnimationFrame(step);
    })();
  }

  // Mouse
  strip.addEventListener('mousedown', function (e) {
    dragging = true; startX = e.clientX; lastX = e.clientX; lastT = Date.now(); vel = 0;
    cancelAnimationFrame(raf);
    pauseAndCapture();
  });
  window.addEventListener('mousemove', function (e) {
    if (!dragging) return;
    var now = Date.now(), dt = now - lastT || 1;
    vel = (e.clientX - lastX) / dt * 16;
    move(e.clientX - lastX);
    lastX = e.clientX; lastT = now;
  });
  window.addEventListener('mouseup', function () {
    if (!dragging) return;
    dragging = false;
    fling();
  });

  // Touch
  strip.addEventListener('touchstart', function (e) {
    dragging = true; startX = e.touches[0].clientX; lastX = startX; lastT = Date.now(); vel = 0;
    cancelAnimationFrame(raf);
    pauseAndCapture();
  }, { passive: true });
  strip.addEventListener('touchmove', function (e) {
    if (!dragging) return;
    var now = Date.now(), dt = now - lastT || 1;
    vel = (e.touches[0].clientX - lastX) / dt * 16;
    move(e.touches[0].clientX - lastX);
    lastX = e.touches[0].clientX; lastT = now;
  }, { passive: true });
  strip.addEventListener('touchend', function () {
    if (!dragging) return;
    dragging = false;
    fling();
  });

  // Hover pause
  strip.addEventListener('mouseenter', function () { if (!dragging) track.classList.add('paused'); });
  strip.addEventListener('mouseleave', function () { if (!dragging) track.classList.remove('paused'); });
})();

/* ── Nav shrink on scroll ── */
(function () {
  var header = document.querySelector('.site-header-wrap');
  if (!header) return;
  function onScroll() {
    if (window.scrollY > 40) {
      header.classList.add('scrolled');
    } else {
      header.classList.remove('scrolled');
    }
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
